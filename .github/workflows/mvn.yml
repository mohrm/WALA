name: Java CI

on:
  push: {}
  schedule:
    # Every day at 3am
    - cron: '0 3 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Cache maven
      uses: actions/cache@v2
      env:
        cache-name: cache-maven
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ env.cache-name }}
        restore-keys: |
          ${{ runner.os }}-maven-
          ${{ runner.os }}-
    - name: Install
      run: mvn clean verify -DskipTests=true -B -q
